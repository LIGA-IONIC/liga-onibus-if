<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Â· Onibus IF</title>
<link rel="stylesheet" href="prints.css">
<style>body{background:#fff;padding:16px 12px 32px}.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}.bloco h2{display:none}.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}.tb{background:#1e40af}.btn.main{background:#1e40af}</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Onibus IF</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Linha Centro</strong><div class="muted">no horario</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Linha Norte</strong><div class="muted">atraso 12 min</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Linha Sul</strong><div class="muted">no horario</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Especial prova</strong><div class="muted">cancelada</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Noturno</strong><div class="muted">atraso 5 min</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Onibus IF</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item"><div><strong>Linha Norte</strong><div><span class="badge warn">atraso 12 min</span></div></div></div><div class="item"><div><strong>Especial prova</strong><div><span class="badge bad">cancelada</span></div></div></div><div class="aviso info">Alunos da linha Norte foram notificados</div><button class="btn main">Reportar atraso</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
